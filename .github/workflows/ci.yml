name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-backend:
    name: Build and test backend
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore backend dependencies
        run: dotnet restore ./backend/MaterialBalanceAPI/MaterialBalanceAPI

      - name: Build backend
        run: dotnet build ./backend/MaterialBalanceAPI/MaterialBalanceAPI --no-restore

      - name: Run unit tests
        run: dotnet test ./backend/MaterialBalanceAPI/Tests/Tests.csproj --verbosity normal

  build-and-push:
    name: Build and push Docker images
    needs: test-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/MaterialBalanceAPI/MaterialBalanceAPI
          file: ./backend/MaterialBalanceAPI/MaterialBalanceAPI/Dockerfile
          push: true
          tags: |
            andrew2077/material_balance:backend-latest
            andrew2077/material_balance:backend-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            andrew2077/material_balance:frontend-latest
            andrew2077/material_balance:frontend-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max